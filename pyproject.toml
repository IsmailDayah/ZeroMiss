[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zeromiss"
version = "0.1.0"
description = "ZeroMiss — a validated missile-guidance interception simulator (Python core)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Ismail Dayah Abdullahi" }]
keywords = [
    "guidance", "navigation", "control", "GNC", "proportional-navigation",
    "missile", "interceptor", "simulation", "monte-carlo", "verification-validation",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "matplotlib>=3.8",
    "typer>=0.9",
    "rich>=13.0",
]

[project.optional-dependencies]
fast = ["numba>=0.59"]
media = ["imageio>=2.31", "imageio-ffmpeg>=0.4"]
data = ["pandas>=2.1", "pyarrow>=14.0"]
docs = ["mkdocs-material>=9.5", "fpdf2>=2.7"]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "hypothesis>=6.90",
    "ruff>=0.1",
    "pandas>=2.1",
    "pyarrow>=14.0",
    "imageio>=2.31",
]

[project.scripts]
zeromiss = "zeromiss.cli:app"

[project.urls]
Homepage = "https://github.com/IsmailDayah/ZeroMiss"
Repository = "https://github.com/IsmailDayah/ZeroMiss"

[tool.setuptools.packages.find]
where = ["engine"]

[tool.setuptools.package-data]
zeromiss = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["zeromiss"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["engine"]
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Typer's idiom is to call typer.Option/Argument in argument defaults.
"engine/zeromiss/cli.py" = ["B008"]
