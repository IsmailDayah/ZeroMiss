name: Deploy (Vercel)

on:
  push:
    branches: [main]
  workflow_dispatch:

# The web app is a fully static export (output: "export"). This workflow always builds
# it (a green build check + downloadable artifact) and ALSO ships it to Vercel *iff* a
# VERCEL_TOKEN secret is configured. NOTE: GitHub forbids the `secrets` context inside an
# `if:` condition, so the secret is mapped to a job-level env var and the deploy step
# gates on `env` (which IS allowed in `if:`).
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Build static site
        run: npm run build
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: zeromiss-web
          path: web/out
      - name: Deploy to Vercel (only if a token is configured)
        if: ${{ env.VERCEL_TOKEN != '' }}
        run: |
          npx vercel deploy --prod --yes --token "$VERCEL_TOKEN" | tee deploy.log
          echo "### ✅ Deployed to Vercel production: $(tail -n1 deploy.log)" >> "$GITHUB_STEP_SUMMARY"
      - name: Warn loudly if the deploy was skipped (no token)
        if: ${{ env.VERCEL_TOKEN == '' }}
        run: |
          echo "::warning title=Vercel deploy SKIPPED::VERCEL_TOKEN is not configured — the site was BUILT but NOT published. The live site was not updated."
          {
            echo "### ⚠️ Vercel deploy SKIPPED — the live site was NOT updated"
            echo "\`VERCEL_TOKEN\` is missing. Add repo secrets **VERCEL_TOKEN**, **VERCEL_ORG_ID**, **VERCEL_PROJECT_ID**, then re-run this workflow."
          } >> "$GITHUB_STEP_SUMMARY"
